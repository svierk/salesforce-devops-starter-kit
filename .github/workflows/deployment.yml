name: Deployment

# Reusable workflow that deploys Salesforce metadata to a target org (sandbox or
# production). Supports a dry-run (validation only) mode, delta deployments,
# anonymous Apex post-deploy scripts and the Agentforce agents of the project.

on:
  workflow_call:
    inputs:
      source-dir:
        description: Source directory to deploy.
        required: false
        type: string
        default: force-app
      build-script:
        description: Optional npm script to run from the repository root before the deployment, e.g. "build:ui-bundles" to build the UI bundles of a Multi-Framework project. It runs with the package manager of the repository and with SF_TARGET_ORG set to the target org. Leave empty to skip.
        required: false
        type: string
        default: ''
      target-org-alias:
        description: Alias used for the authenticated target org.
        required: false
        type: string
        default: target-org
      test-level:
        description: Apex test level for the deployment. Ignored when apex-tests is set.
        required: false
        type: string
        default: RunLocalTests
      apex-tests:
        description: Comma-separated or multi-line list of Apex test classes to run during the deployment. A selection always runs with RunSpecifiedTests. Leave empty to run the test-level.
        required: false
        type: string
        default: ''
      dry-run:
        description: Validate the deployment without saving the components (check-only).
        required: false
        type: boolean
        default: false
      delta:
        description: Deploy only the components changed since delta-from.
        required: false
        type: boolean
        default: false
      delta-from:
        description: Git ref to compare from when delta is enabled, e.g. a previous release tag.
        required: false
        type: string
        default: ''
      apex-file-path:
        description: Comma-separated anonymous Apex file(s) or glob(s) to execute after a successful deployment, e.g. "./scripts/apex/post-deploy/*.apex". Skipped on a dry-run. Leave empty to skip.
        required: false
        type: string
        default: ''
      deploy-agents:
        description: Bring the Agentforce agents found in source-dir to the org after the deployment - publish and activate them, then deploy their tests. On a dry-run, their Agent Script is only validated. A project without agents skips this.
        required: false
        type: boolean
        default: true
      activate-agents:
        description: Activate the agent versions after publishing. Set to false to leave the currently active versions in place.
        required: false
        type: boolean
        default: true
      agent-post-publish-dir:
        description: Comma-separated or multi-line list of source directories to deploy once the agents exist, e.g. permission sets granting access to an agent. Keep them outside of source-dir. Leave empty to skip.
        required: false
        type: string
        default: ''
      agent-tests:
        description: Run the agent tests of the project against the org. Opt-in, because they consume Einstein Requests or Flex Credits and can change org data. Needs deploy-agents. A project without agent tests skips this.
        required: false
        type: boolean
        default: false
      agent-test-names:
        description: Comma-separated or multi-line list of agent tests to run instead of all tests of the project. Leave empty to run all.
        required: false
        type: string
        default: ''
      environment:
        description: Optional GitHub Environment to run in - enables protection rules (required reviewers) and environment-scoped secrets. Leave empty to run without one.
        required: false
        type: string
        default: ''
      ref:
        description: Optional branch, tag or commit SHA to check out and deploy, e.g. an environment branch for a scheduled full validation, or a release tag. Leave empty to deploy the ref that triggered the workflow.
        required: false
        type: string
        default: ''
    secrets:
      SFDX_CONSUMER_KEY:
        description: Consumer key (client ID) of the connected app used for the JWT flow.
        required: true
      SFDX_JWT_SECRET_KEY:
        description: Contents of the private server key (server.key) used for the JWT flow.
        required: true
      SFDX_USERNAME:
        description: Username of the integration user to authenticate as.
        required: true

# Least-privilege token: this workflow only reads the repository and talks to
# Salesforce via the CLI, it never writes back to GitHub.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # An empty string means no environment; pass one to gate production behind
    # protection rules and resolve environment-scoped secrets.
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Empty checks out the triggering ref, exactly as before this input existed.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # Node.js is only needed for a build-script. Both version overrides below
      # read repository variables of the calling repository. Leave them unset
      # for the defaults (engines.node from package.json / latest SF CLI);
      # populate them to pin a version without touching any workflow file.
      - name: Select Node Version
        id: node
        if: ${{ inputs.build-script != '' }}
        uses: svierk/get-node-version@v1.6.0
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install SF CLI
        uses: svierk/sfdx-cli-setup@v1.2.0
        with:
          version: ${{ vars.SF_CLI_VERSION_OVERRIDE }}

      - name: Salesforce Org Login
        uses: svierk/sfdx-login@v1.4.3
        with:
          client-id: ${{ secrets.SFDX_CONSUMER_KEY }}
          jwt-secret-key: ${{ secrets.SFDX_JWT_SECRET_KEY }}
          username: ${{ secrets.SFDX_USERNAME }}
          alias: ${{ inputs.target-org-alias }}

      # Runs after the login: the UI bundle plugins bake the API version of the
      # org in SF_TARGET_ORG into the build - without it they read the CLI's
      # default org, or fall back to v50.0. The script name is passed through
      # env, never interpolated into the shell.
      - name: Build
        if: ${{ inputs.build-script != '' }}
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
          PACKAGE_MANAGER: ${{ steps.node.outputs.package-manager }}
          SF_TARGET_ORG: ${{ inputs.target-org-alias }}
        run: '"$PACKAGE_MANAGER" run "$BUILD_SCRIPT"'

      # Finds what the deployment has to leave out: test definitions and permission
      # sets need a published agent, and an active agent version can't be deployed.
      - name: Prepare Agents
        id: agents
        if: ${{ inputs.deploy-agents }}
        uses: svierk/sfdx-agent-deploy@v1.0.0
        with:
          phase: prepare
          source-dir: ${{ inputs.source-dir }}
          target-org: ${{ inputs.target-org-alias }}

      - name: Deploy Metadata
        env:
          # For a "replaceWithEnv" replacement in sfdx-project.json, e.g. the agent
          # user in an Agent Script, which is different in every org. Set it as a
          # repository or environment variable.
          SF_AGENT_USERNAME: ${{ vars.SF_AGENT_USERNAME }}
        uses: svierk/sfdx-deploy@v1.4.0
        with:
          source-dir: ${{ inputs.delta == false && inputs.source-dir || '' }}
          exclude: ${{ steps.agents.outputs.exclude }}
          delta: ${{ inputs.delta }}
          delta-from: ${{ inputs.delta-from }}
          target-org: ${{ inputs.target-org-alias }}
          test-level: ${{ inputs.test-level }}
          tests: ${{ inputs.apex-tests }}
          dry-run: ${{ inputs.dry-run }}

      # A dry-run saves nothing, so post-deploy scripts would run against
      # metadata that was never deployed - only run them on a real deployment.
      - name: Run Post-Deploy Scripts
        if: ${{ !inputs.dry-run && inputs.apex-file-path != '' }}
        uses: svierk/sfdx-apex-execute@v1.0.0
        with:
          file-path: ${{ inputs.apex-file-path }}
          target-org: ${{ inputs.target-org-alias }}

      # Runs after everything the agents use has arrived: a publish does not deploy
      # the Apex classes and flows behind the actions, and the agent user has to exist.
      - name: Deploy Agents
        if: ${{ inputs.deploy-agents }}
        env:
          # For a "replaceWithEnv" replacement in sfdx-project.json, e.g. the agent
          # user in an Agent Script, which is different in every org. Set it as a
          # repository or environment variable.
          SF_AGENT_USERNAME: ${{ vars.SF_AGENT_USERNAME }}
        uses: svierk/sfdx-agent-deploy@v1.0.0
        with:
          source-dir: ${{ inputs.source-dir }}
          target-org: ${{ inputs.target-org-alias }}
          activate: ${{ inputs.activate-agents }}
          post-publish-dir: ${{ inputs.agent-post-publish-dir }}
          dry-run: ${{ inputs.dry-run }}

      - name: Run Agent Tests
        if: ${{ inputs.deploy-agents && inputs.agent-tests && !inputs.dry-run }}
        uses: svierk/sfdx-run-tests@v1.4.0
        with:
          apex: false
          agent: true
          agent-tests: ${{ inputs.agent-test-names }}
          target-org: ${{ inputs.target-org-alias }}

      - name: Upload Agent Test Results
        if: ${{ always() && inputs.deploy-agents && inputs.agent-tests && !inputs.dry-run }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-test-results
          path: ./tests/agent
          if-no-files-found: ignore
