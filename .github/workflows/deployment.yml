name: Deployment

# Reusable workflow that deploys Salesforce metadata to a target org (sandbox or
# production). Supports a dry-run (validation only) mode, delta deployments and
# anonymous Apex post-deploy scripts.

on:
  workflow_call:
    inputs:
      source-dir:
        description: Source directory to deploy.
        required: false
        type: string
        default: force-app
      target-org-alias:
        description: Alias used for the authenticated target org.
        required: false
        type: string
        default: target-org
      test-level:
        description: Apex test level for the deployment. Ignored when apex-tests is set.
        required: false
        type: string
        default: RunLocalTests
      apex-tests:
        description: Comma-separated or multi-line list of Apex test classes to run during the deployment. A selection always runs with RunSpecifiedTests. Leave empty to run the test-level.
        required: false
        type: string
        default: ''
      dry-run:
        description: Validate the deployment without saving the components (check-only).
        required: false
        type: boolean
        default: false
      delta:
        description: Deploy only the components changed since delta-from.
        required: false
        type: boolean
        default: false
      delta-from:
        description: Git ref to compare from when delta is enabled, e.g. a previous release tag.
        required: false
        type: string
        default: ''
      apex-file-path:
        description: Comma-separated anonymous Apex file(s) or glob(s) to execute after a successful deployment, e.g. "./scripts/apex/post-deploy/*.apex". Skipped on a dry-run. Leave empty to skip.
        required: false
        type: string
        default: ''
      environment:
        description: Optional GitHub Environment to run in - enables protection rules (required reviewers) and environment-scoped secrets. Leave empty to run without one.
        required: false
        type: string
        default: ''
    secrets:
      SFDX_CONSUMER_KEY:
        description: Consumer key (client ID) of the connected app used for the JWT flow.
        required: true
      SFDX_JWT_SECRET_KEY:
        description: Contents of the private server key (server.key) used for the JWT flow.
        required: true
      SFDX_USERNAME:
        description: Username of the integration user to authenticate as.
        required: true

# Least-privilege token: this workflow only reads the repository and talks to
# Salesforce via the CLI, it never writes back to GitHub.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # An empty string means no environment; pass one to gate production behind
    # protection rules and resolve environment-scoped secrets.
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # The version override reads a repository variable of the calling
      # repository. Leave it unset to install the latest SF CLI; populate it
      # to pin a version without touching any workflow file.
      - name: Install SF CLI
        uses: svierk/sfdx-cli-setup@v1.2.0
        with:
          version: ${{ vars.SF_CLI_VERSION_OVERRIDE }}

      - name: Salesforce Org Login
        uses: svierk/sfdx-login@v1.4.3
        with:
          client-id: ${{ secrets.SFDX_CONSUMER_KEY }}
          jwt-secret-key: ${{ secrets.SFDX_JWT_SECRET_KEY }}
          username: ${{ secrets.SFDX_USERNAME }}
          alias: ${{ inputs.target-org-alias }}

      - name: Deploy Metadata
        uses: svierk/sfdx-deploy@v1.3.0
        with:
          source-dir: ${{ inputs.delta == false && inputs.source-dir || '' }}
          delta: ${{ inputs.delta }}
          delta-from: ${{ inputs.delta-from }}
          target-org: ${{ inputs.target-org-alias }}
          test-level: ${{ inputs.test-level }}
          tests: ${{ inputs.apex-tests }}
          dry-run: ${{ inputs.dry-run }}

      # A dry-run saves nothing, so post-deploy scripts would run against
      # metadata that was never deployed - only run them on a real deployment.
      - name: Run Post-Deploy Scripts
        if: ${{ !inputs.dry-run && inputs.apex-file-path != '' }}
        uses: svierk/sfdx-apex-execute@v1.0.0
        with:
          file-path: ${{ inputs.apex-file-path }}
          target-org: ${{ inputs.target-org-alias }}
