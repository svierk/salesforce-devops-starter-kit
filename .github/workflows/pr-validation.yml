name: PR Validation

# Reusable workflow that validates a pull request without changing the target
# org: it runs static code analysis and a check-only (dry-run) delta deployment
# including Apex tests. Call it from your own repository via `uses:`.

on:
  workflow_call:
    inputs:
      source-dir:
        description: Source directory to analyze and validate.
        required: false
        type: string
        default: force-app
      build-script:
        description: Optional npm script to run from the repository root before the validation deployment, e.g. "build:ui-bundles" to build the UI bundles of a Multi-Framework project. It runs after the code review, with the package manager of the repository and with SF_TARGET_ORG set to the validation org. Leave empty to skip.
        required: false
        type: string
        default: ''
      target-org-alias:
        description: Alias used for the authenticated validation org.
        required: false
        type: string
        default: ci
      test-level:
        description: Apex test level for the validation deployment. Ignored when apex-tests is set.
        required: false
        type: string
        default: RunLocalTests
      apex-tests:
        description: Comma-separated or multi-line list of Apex test classes to run during the validation deployment. A selection always runs with RunSpecifiedTests. Leave empty to run the test-level.
        required: false
        type: string
        default: ''
      delta:
        description: Validate only the components changed in the pull request.
        required: false
        type: boolean
        default: true
      run-code-review:
        description: Run the code review (Salesforce Code Analyzer).
        required: false
        type: boolean
        default: true
      severity-threshold:
        description: Fail if a code analyzer violation with this severity or higher is found.
        required: false
        type: string
        default: '3'
      environment:
        description: Optional GitHub Environment to validate in - its environment-scoped secrets select the org to validate against, e.g. one environment per target branch. Use an environment without required reviewers or branch restrictions, or every pull request waits for an approval or is rejected. Leave empty to use the repository secrets.
        required: false
        type: string
        default: ''
    secrets:
      SFDX_CONSUMER_KEY:
        description: Consumer key (client ID) of the connected app used for the JWT flow.
        required: true
      SFDX_JWT_SECRET_KEY:
        description: Contents of the private server key (server.key) used for the JWT flow.
        required: true
      SFDX_USERNAME:
        description: Username of the integration user to authenticate as.
        required: true

# Least-privilege token: read the repository, plus write the code analysis
# results back as a SARIF report (required by the upload-sarif step).
permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # An empty string means no environment and the repository secrets; pass one
    # to validate against the org behind that environment instead.
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # Both version overrides below read repository variables of the calling
      # repository. Leave them unset for the defaults (engines.node from
      # package.json / latest SF CLI); populate them to pin a version without
      # touching any workflow file. The dependency cache follows the package
      # manager of the calling repository (npm, yarn or pnpm, detected from
      # package.json or the lock file) and is skipped without a lock file.
      - name: Select Node Version
        id: node
        uses: svierk/get-node-version@v1.6.0
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install SF CLI
        uses: svierk/sfdx-cli-setup@v1.2.0
        with:
          version: ${{ vars.SF_CLI_VERSION_OVERRIDE }}

      - name: Salesforce Org Login
        uses: svierk/sfdx-login@v1.4.3
        with:
          client-id: ${{ secrets.SFDX_CONSUMER_KEY }}
          jwt-secret-key: ${{ secrets.SFDX_JWT_SECRET_KEY }}
          username: ${{ secrets.SFDX_USERNAME }}
          alias: ${{ inputs.target-org-alias }}

      - name: Code Review
        if: ${{ inputs.run-code-review }}
        continue-on-error: true
        uses: svierk/sfdx-code-review@v1.1.1
        with:
          code-analyzer: true
          workspace: ${{ inputs.source-dir }}
          output-file: results.sarif
          severity-threshold: ${{ inputs.severity-threshold }}

      - name: Upload SARIF
        if: ${{ inputs.run-code-review }}
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: results.sarif

      # Runs after the code review, so the analyzer never scans the installed
      # dependencies and build output, and after the login: the UI bundle
      # plugins bake the API version of the org in SF_TARGET_ORG into the
      # build - without it they read the CLI's default org, or fall back to
      # v50.0. The script name is passed through env, never interpolated into
      # the shell.
      - name: Build
        if: ${{ inputs.build-script != '' }}
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
          PACKAGE_MANAGER: ${{ steps.node.outputs.package-manager }}
          SF_TARGET_ORG: ${{ inputs.target-org-alias }}
        run: '"$PACKAGE_MANAGER" run "$BUILD_SCRIPT"'

      - name: Validate Deployment (dry-run)
        uses: svierk/sfdx-deploy@v1.3.1
        with:
          source-dir: ${{ inputs.delta == false && inputs.source-dir || '' }}
          delta: ${{ inputs.delta }}
          delta-from: origin/${{ github.base_ref }}
          delta-to: HEAD
          target-org: ${{ inputs.target-org-alias }}
          test-level: ${{ inputs.test-level }}
          tests: ${{ inputs.apex-tests }}
          dry-run: true
