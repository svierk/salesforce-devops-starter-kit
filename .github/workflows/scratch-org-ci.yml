name: Scratch Org CI

# Reusable workflow that runs a full scratch org lifecycle: it authenticates to
# the Dev Hub, creates a scratch org, optionally installs dependency packages,
# deploys the source, optionally assigns permissions and runs anonymous Apex
# setup scripts, runs Apex tests, and always deletes the scratch org again.

on:
  workflow_call:
    inputs:
      source-dir:
        description: Source directory to deploy to the scratch org.
        required: false
        type: string
        default: force-app
      build-script:
        description: Optional npm script to run from the repository root before the deployment, e.g. "build:ui-bundles" to build the UI bundles of a Multi-Framework project. It runs with the package manager of the repository and with SF_TARGET_ORG set to the scratch org. Leave empty to skip.
        required: false
        type: string
        default: ''
      definition-file:
        description: Path to the scratch org definition file.
        required: false
        type: string
        default: config/project-scratch-def.json
      duration-days:
        description: Number of days before the scratch org expires.
        required: false
        type: string
        default: '1'
      test-level:
        description: Apex test level for the test run. Ignored when apex-tests is set.
        required: false
        type: string
        default: RunLocalTests
      apex-tests:
        description: Comma-separated or multi-line list of Apex tests to run as "Class" or "Class.method". A selection always runs with RunSpecifiedTests. Leave empty to run the test-level.
        required: false
        type: string
        default: ''
      packages:
        description: Comma-separated or multi-line list of dependency packages (aliases or IDs) to install, e.g. "04t...,04t...". Leave empty to skip.
        required: false
        type: string
        default: ''
      permission-sets:
        description: Comma-separated or multi-line list of permission sets to assign to the scratch org admin user before the tests run. Leave empty to skip.
        required: false
        type: string
        default: ''
      permission-set-groups:
        description: Comma-separated or multi-line list of permission set groups to assign to the scratch org admin user. Leave empty to skip.
        required: false
        type: string
        default: ''
      permission-set-licenses:
        description: Comma-separated or multi-line list of permission set licenses to assign to the scratch org admin user. Leave empty to skip.
        required: false
        type: string
        default: ''
      apex-file-path:
        description: Comma-separated anonymous Apex file(s) or glob(s) to execute before the tests, e.g. "./scripts/apex/setup/*.apex". Leave empty to skip.
        required: false
        type: string
        default: ''
    secrets:
      SFDX_CONSUMER_KEY:
        description: Consumer key (client ID) of the Dev Hub connected app used for the JWT flow.
        required: true
      SFDX_JWT_SECRET_KEY:
        description: Contents of the private server key (server.key) used for the JWT flow.
        required: true
      SFDX_USERNAME:
        description: Username of the Dev Hub integration user to authenticate as.
        required: true

# Least-privilege token: this workflow only reads the repository and talks to
# Salesforce via the CLI, it never writes back to GitHub.
permissions:
  contents: read

jobs:
  scratch-org-ci:
    name: Scratch Org CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # Both version overrides below read repository variables of the calling
      # repository. Leave them unset for the defaults (engines.node from
      # package.json / latest SF CLI); populate them to pin a version without
      # touching any workflow file. The dependency cache follows the package
      # manager of the calling repository (npm, yarn or pnpm, detected from
      # package.json or the lock file) and is skipped without a lock file.
      - name: Select Node Version
        id: node
        uses: svierk/get-node-version@v1.6.0
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install SF CLI
        uses: svierk/sfdx-cli-setup@v1.2.0
        with:
          version: ${{ vars.SF_CLI_VERSION_OVERRIDE }}

      - name: Authorize Dev Hub
        uses: svierk/sfdx-login@v1.4.3
        with:
          client-id: ${{ secrets.SFDX_CONSUMER_KEY }}
          jwt-secret-key: ${{ secrets.SFDX_JWT_SECRET_KEY }}
          username: ${{ secrets.SFDX_USERNAME }}
          set-default-dev-hub: true
          alias: devhub

      - name: Create Scratch Org
        id: scratch
        uses: svierk/sfdx-create-scratch-org@v1.3.2
        with:
          target-dev-hub: devhub
          definition-file: ${{ inputs.definition-file }}
          duration-days: ${{ inputs.duration-days }}
          set-default: true
          alias: scratch-${{ github.run_id }}

      - name: Install Dependency Packages
        if: ${{ inputs.packages != '' }}
        uses: svierk/sfdx-package-installation@v1.3.0
        with:
          packages: ${{ inputs.packages }}
          target-org: ${{ steps.scratch.outputs.username }}
          wait: 30
          publish-wait: 20

      # Runs once the scratch org exists: the UI bundle plugins bake the API
      # version of the org in SF_TARGET_ORG into the build - without it they
      # read the CLI's default org, or fall back to v50.0. The script name is
      # passed through env, never interpolated into the shell.
      - name: Build
        if: ${{ inputs.build-script != '' }}
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
          PACKAGE_MANAGER: ${{ steps.node.outputs.package-manager }}
          SF_TARGET_ORG: ${{ steps.scratch.outputs.username }}
        run: '"$PACKAGE_MANAGER" run "$BUILD_SCRIPT"'

      - name: Deploy Metadata
        uses: svierk/sfdx-deploy@v1.3.1
        with:
          source-dir: ${{ inputs.source-dir }}
          target-org: ${{ steps.scratch.outputs.username }}
          destructive-changes: false # fresh scratch org: additive deploy, nothing to delete

      - name: Assign Permissions
        if: ${{ inputs.permission-sets != '' || inputs.permission-set-groups != '' || inputs.permission-set-licenses != '' }}
        uses: svierk/sfdx-assign-permissions@v1.0.0
        with:
          permission-sets: ${{ inputs.permission-sets }}
          permission-set-groups: ${{ inputs.permission-set-groups }}
          permission-set-licenses: ${{ inputs.permission-set-licenses }}
          target-org: ${{ steps.scratch.outputs.username }}

      - name: Run Setup Scripts
        if: ${{ inputs.apex-file-path != '' }}
        uses: svierk/sfdx-apex-execute@v1.0.0
        with:
          file-path: ${{ inputs.apex-file-path }}
          target-org: ${{ steps.scratch.outputs.username }}

      - name: Run Tests
        uses: svierk/sfdx-run-tests@v1.2.0
        with:
          apex: true
          target-org: ${{ steps.scratch.outputs.username }}
          test-level: ${{ inputs.test-level }}
          apex-tests: ${{ inputs.apex-tests }}
          apex-output-dir: ./tests/apex

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apex-test-results
          path: ./tests/apex

      - name: Delete Scratch Org
        if: always()
        uses: svierk/sfdx-delete-scratch-org@v1.1.3
        with:
          target-org: ${{ steps.scratch.outputs.username }}
